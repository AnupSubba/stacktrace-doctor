# GitLab CI: lint and test on every merge request and on main.
# Tests never call real LLM APIs, so no secrets are needed here.
image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim   # pick a current tag if this one has moved on

variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

cache:
  key:
    files: [uv.lock]
  paths: [.uv-cache]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages: [check, test]

lint:
  stage: check
  script:
    - uv sync --locked
    - uv run ruff check .
    - uv run ruff format --check .

requirements-up-to-date:
  stage: check
  script:
    - uv export --format requirements-txt --no-hashes --no-dev --no-header > /tmp/requirements.txt
    - diff -u requirements.txt /tmp/requirements.txt

test:
  stage: test
  script:
    - uv sync --locked
    - uv run pytest -q
